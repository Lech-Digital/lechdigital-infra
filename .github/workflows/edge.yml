# The edge (Caddy). Every push and PR validates the Caddyfile; "Run workflow" deploys it, and Caddy reloads in place
# (no dropped connections, no new certificates).
name: Edge

on:
  push:
    paths: [edge/**, .github/workflows/edge.yml]
  pull_request:
    paths: [edge/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Caddyfile
        run: |
          image=$(grep -o 'caddy:[0-9.]*' edge/compose.yml)
          docker run --rm -v "$PWD/edge/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/edge/sites:/etc/caddy/sites:ro" \
            "$image" caddy validate --config /etc/caddy/Caddyfile

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: edge
    steps:
      - uses: actions/checkout@v4
      - name: SSH to the server
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName 167.233.145.128\n  User deploy\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - name: Copy and reload
        run: |
          rsync -az --delete edge/ prod:/opt/lechdigital-edge/
          ssh prod 'cd /opt/lechdigital-edge && docker compose up -d && docker exec lechdigital-caddy caddy reload --config /etc/caddy/Caddyfile'
      - name: Every site answers
        run: |
          for host in $(grep -ho '^[a-z0-9.-]*\.[a-z]* {' edge/sites/*.caddy | tr -d ' {'); do
            code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "https://$host" || true)
            echo "$host $code"
            if [ "$code" = "000" ]; then echo "::warning::$host does not answer"; fi
          done
